name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Run end-to-end numerical comparison
        env:
          MPLBACKEND: Agg
        run: python examples/compare_interpolation_methods.py --save-plots /tmp/bezier-plots --no-show
